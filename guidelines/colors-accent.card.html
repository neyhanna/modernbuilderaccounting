<link rel="stylesheet" href="../styles.css" />
<div style="font-family: var(--mba-font-body); padding: 24px; background: var(--mba-white);">
  <div class="mba-eyebrow" style="color: var(--mba-blue); margin-bottom: 16px;">Accents</div>
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px;">
    <div>
      <div style="height: 64px; border-radius: 4px; background: #1B67F2;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">Brand blue</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#1B67F2 &middot; links, badges</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #4E9EFF;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">Accent blue</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#4E9EFF &middot; eyebrows on dark</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #EEF4FF; border: 1px solid var(--mba-border);"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">Blue tint</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#EEF4FF &middot; badge pill bg</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #7A8FA8;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">Body on dark</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#7A8FA8 &middot; dark body copy</div>
    </div>
  </div>
  <div style="background: var(--mba-navy-dark); border-radius: 4px; padding: 32px;">
    <div class="mba-eyebrow mba-eyebrow--dark" style="margin-bottom: 12px;">Body copy on dark</div>
    <p style="font-family: var(--mba-font-body); font-size: 15px; line-height: 1.85; color: var(--mba-body-on-dark); margin: 0; max-width: 480px;">
      Set at #7A8FA8 against navy backgrounds &mdash; readable without competing with the cream headline color above it.
    </p>
  </div>
</div>
