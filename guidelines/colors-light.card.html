<link rel="stylesheet" href="../styles.css" />
<div style="font-family: var(--mba-font-body); padding: 24px; background: var(--mba-white);">
  <div class="mba-eyebrow" style="color: var(--mba-blue); margin-bottom: 16px;">Light / UI Palette</div>
  <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;">
    <div>
      <div style="height: 64px; border-radius: 4px; background: #FFFFFF; border: 1px solid var(--mba-border);"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">White</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#FFFFFF &middot; primary bg</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #F7F9FC; border: 1px solid var(--mba-border);"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">Light gray</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#F7F9FC &middot; subtle bg</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #E4EAF3;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">Border</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#E4EAF3 &middot; dividers</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #6B7280;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">Text muted</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#6B7280 &middot; body copy</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #9CA3AF;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-navy); font-weight: 500;">Text light</div>
      <div class="mba-small" style="color: var(--mba-text-light);">#9CA3AF &middot; labels</div>
    </div>
  </div>
</div>
