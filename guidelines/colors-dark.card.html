<link rel="stylesheet" href="../styles.css" />
<div style="font-family: var(--mba-font-body); padding: 24px; background: var(--mba-navy-dark);">
  <div class="mba-eyebrow" style="color: var(--mba-blue-accent); margin-bottom: 16px;">Dark / Brand Palette</div>
  <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;">
    <div>
      <div style="height: 64px; border-radius: 4px; background: #0B1F3A;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-cream); font-weight: 500;">Primary navy</div>
      <div class="mba-small" style="color: var(--mba-body-on-dark);">#0B1F3A &middot; nav / buttons</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #0A1628;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-cream); font-weight: 500;">Dark navy</div>
      <div class="mba-small" style="color: var(--mba-body-on-dark);">#0A1628 &middot; service sections</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #0D1E38;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-cream); font-weight: 500;">Section dark</div>
      <div class="mba-small" style="color: var(--mba-body-on-dark);">#0D1E38 &middot; CTA background</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #071020;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-cream); font-weight: 500;">Footer</div>
      <div class="mba-small" style="color: var(--mba-body-on-dark);">#071020 &middot; deepest dark</div>
    </div>
    <div>
      <div style="height: 64px; border-radius: 4px; background: #EDE8DC;"></div>
      <div class="mba-small" style="margin-top: 8px; color: var(--mba-cream); font-weight: 500;">Cream</div>
      <div class="mba-small" style="color: var(--mba-body-on-dark);">#EDE8DC &middot; text on dark</div>
    </div>
  </div>
</div>
