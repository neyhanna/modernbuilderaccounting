    <div><div style="width: 24px; height: 4px; background: var(--mba-blue);"></div><div class="mba-small" style="margin-top: 4px; color: var(--mba-text-light);">4</div></div>
    <div><div style="width: 24px; height: 8px; background: var(--mba-blue);"></div><div class="mba-small" style="margin-top: 4px; color: var(--mba-text-light);">8</div></div>
    <div><div style="width: 24px; height: 16px; background: var(--mba-blue);"></div><div class="mba-small" style="margin-top: 4px; color: var(--mba-text-light);">16</div></div>
    <div><div style="width: 24px; height: 24px; background: var(--mba-blue);"></div><div class="mba-small" style="margin-top: 4px; color: var(--mba-text-light);">24</div></div>
    <div><div style="width: 24px; height: 40px; background: var(--mba-blue);"></div><div class="mba-small" style="margin-top: 4px; color: var(--mba-text-light);">40</div></div>

  </div>
  <p class="mba-small" style="color: var(--mba-text-light); margin-top: 16px;">Sections use 80&ndash;96px vertical padding on desktop; content areas cap at 1120&ndash;1200px centered.</p>
</div>
