function Eyebrow({ tone = 'light', style, children }) {

}

function Badge({ children }) {

const PAGE_COMPONENTS = {
  home: HomePage,
  services: ServicesPage,
  technology: TechnologyPage,
  team: TeamPage,
  contact: ContactPage,
};

function App() {
  const initial = (window.location.hash || '#home').replace('#', '');
  const [page, setPage] = useState(PAGE_COMPONENTS[initial] ? initial : 'home');

  const navigate = (key) => {
    setPage(key);
    window.location.hash = key;
    window.scrollTo(0, 0);
  };

  const Page = PAGE_COMPONENTS[page];

  return (
    <div className="mba-page">
      <NavBar active={page} onNavigate={navigate} />
      <Page />
      <Footer onNavigate={navigate} />
      <div className="mba-proto-switcher">
        {PAGES.map((p) => (
          <button key={p.key} className={page === p.key ? 'active' : ''} onClick={() => navigate(p.key)}>{p.label}</button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
